<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Sundry Reimbursement" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">i</span><span>Reimbursement</span></a>
  <nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('history') }}">History</a><a href="{{ url_for('admin_approval') }}">Admin Approval</a></nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="flash-wrap">{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
